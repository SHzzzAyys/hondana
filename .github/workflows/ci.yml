name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + test deps
        # 从 requirements.txt 装(显式过滤掉 pywebview, 它要 GTK/proxy_tools 构建链,
        # CI 跑不到桌面壳)。其他依赖随 requirements.txt 自动跟进。
        run: |
          python -m pip install --upgrade pip
          grep -v '^pywebview' requirements.txt > /tmp/ci-requirements.txt
          pip install -r /tmp/ci-requirements.txt
          pip install "pytest>=8.0"

      - name: Run pytest
        env:
          SECRET_KEY: ci-test-secret-not-real
        run: pytest -v --tb=short
